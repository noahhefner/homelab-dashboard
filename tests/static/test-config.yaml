title: "Home Lab"
editor: true

show_search: true
show_bookmarks: true

search_engine: "https://duckduckgo.com/?q={query}"
search_engine_icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/duckduckgo.svg"

tile_groups:
