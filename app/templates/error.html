<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="The homelab dashboard could not be started due to a configuration error." />
        <title>Configuration Error</title>
        <link rel="icon" type="image/x-icon"
              href="{{ url_for('static', filename='favicon_io/favicon.ico') }}" />
        <link rel="icon" type="image/png" sizes="32x32"
              href="{{ url_for('static', filename='favicon_io/favicon-32x32.png') }}" />
        <link rel="icon" type="image/png" sizes="16x16"
              href="{{ url_for('static', filename='favicon_io/favicon-16x16.png') }}" />
        <link rel="apple-touch-icon" sizes="180x180"
              href="{{ url_for('static', filename='favicon_io/apple-touch-icon.png') }}" />
        <link rel="manifest"
              href="{{ url_for('static', filename='favicon_io/site.webmanifest') }}" />
        <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #1e2124;
        color: #e8e6e3;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
      }
      .card {
        background: #282b30;
        border: 1px solid #3a3d43;
        border-radius: 8px;
        padding: 1.5rem 2rem;
        max-width: 560px;
        width: 100%;
      }
      h1 {
        margin-top: 0;
        color: #f87171;
        font-size: 1.25rem;
      }
      pre {
        background: #1e2124;
        border-radius: 4px;
        padding: 1rem;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: #d7d3cb;
      }
      p {
        color: #b0adb5;
      }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Configuration Error</h1>
            <p>The dashboard config could not be loaded. Please check the YAML file and try again.</p>
            <pre>{{ message }}</pre>
        </div>
    </body>
</html>
