# Custom dashboard title shown in the navbar. Omit it (or leave it empty) to
# use the default "Homelab".
title: "Home Lab"
editor: true

# Tiles are general-purpose links. Each points to either an internal homelab
# service or an external service (e.g., an email provider's webmail, a cloud
# account portal, a SaaS admin console). Any valid http(s) URL opens in a new tab.
tiles:
  - name: Plex
    url: "https://plex.lan:3240"
    icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/plex.svg"
  - name: Nextcloud
    url: "https://cloud.lan"
    icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/nextcloud.svg"
  - name: Proxmox
    url: "https://proxmox.lan:8006"
    icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/proxmox.svg"
  - name: Grafana
    url: "https://grafana.lan"
    icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/grafana.svg"
  - name: Pi-hole
    url: "https://pihole.lan/admin"
    icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/pihole.svg"
  - name: Unifi Controller
    url: "https://unifi.lan:8443"

# Tiles can also be organized into named groups. Tile groups are always visible
# (no collapse/expand), unlike bookmark groups below.
tile_groups:
  - name: Cloud & Webmail
    icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/protonmail.svg"
    tiles:
      - name: Webmail
        url: "https://mail.example.com"
      - name: Cloud Drive
        url: "https://drive.example.com"

