when:
  event: manual

steps:
  - name: build-and-publish
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: nhefner/homelab-dashboard
      dockerfile: Dockerfile
      platforms: linux/amd64
      tag: latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
