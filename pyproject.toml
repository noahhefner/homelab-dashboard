[project]
name = "homelab-dashboard"
version = "0.1.0"
description = "Self-hosted home server dashboard homepage driven by a single YAML config"
readme = "README.md"
authors = [
    { name = "Noah Hefner", email = "nhefner127+github@protonmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=27.0.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "djlint>=1.50.3",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "uv-upsync>=2.4.2",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
