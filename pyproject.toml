[project]
name = "homelab-dashboard"
version = "0.1.0"
description = "Self-hosted home server dashboard homepage driven by a single YAML config"
readme = "README.md"
authors = [
    { name = "Noah Hefner", email = "nhefner127+github@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "djlint>=1.45.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.78",
    "uv-upsync>=2.4.1",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
